name: "Deploy — Build, Publish & Workload Trigger"

on:
  push:
    branches:
      - main
      - master
      - serverless
    paths:
      - "application/**"
      - "kubernetes/**"
      - "terraform/**"
      - "Dockerfile"

permissions:
  id-token: write  # Required for AWS OIDC authentication
  contents: read

env:
  AWS_REGION: "us-east-1"
  ECR_REPOSITORY: "ray-data-pipeline"
  EKS_CLUSTER_NAME: "ray-platform-test-eks"

jobs:
  build-and-publish:
    name: "Build & Push ECR Image"
    runs-on: ubuntu-latest
    outputs:
      image_uri: ${{ steps.build-image.outputs.image }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOYMENT_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: "sts.amazonaws.com"

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag and Push Image to Amazon ECR
        id: build-image
        run: |
          REGISTRY="${{ steps.login-ecr.outputs.registry }}"
          COMMIT_SHA="$(git rev-parse --short HEAD)"
          IMAGE_TAG="${REGISTRY}/${ECR_REPOSITORY}:${COMMIT_SHA}"
          IMAGE_LATEST="${REGISTRY}/${ECR_REPOSITORY}:latest"

          docker build -t "$IMAGE_TAG" -t "$IMAGE_LATEST" -f application/Dockerfile .
          docker push "$IMAGE_TAG"
          docker push "$IMAGE_LATEST"

          echo "image=${IMAGE_TAG}" >> $GITHUB_OUTPUT
