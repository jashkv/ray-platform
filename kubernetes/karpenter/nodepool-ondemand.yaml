apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: ray-ondemand-fallback
  labels:
    app.kubernetes.io/part-of: ray-platform
    environment: test
spec:
  template:
    metadata:
      labels:
        workload-role: ray-worker
        ray.io/node-type: worker
        lifecycle: OnDemand
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default

      taints:
        - key: workload-role
          value: ray-worker
          effect: NoSchedule

      requirements:
        # Strictly On-Demand capacity for non-interruptible workloads or when Spot is fully unavailable
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]

        - key: kubernetes.io/arch
          operator: In
          values: ["arm64", "amd64"]

        - key: karpenter.k8s.aws/instance-family
          operator: In
          values: ["m7g", "m6g", "m7a", "m6i"]

        - key: karpenter.k8s.aws/instance-size
          operator: In
          values: ["xlarge", "2xlarge"]

  limits:
    cpu: "32"
    memory: "128Gi"

  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 60s
    budgets:
      - nodes: "10%"

  # Lower weight than Spot pool (50) so Karpenter prefers Spot capacity
  weight: 10
