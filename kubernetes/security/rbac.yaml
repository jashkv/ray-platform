apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ray-workload-role
  namespace: ray-workloads
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/status", "pods/log"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch", "create"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["ray.io"]
    resources: ["rayclusters", "rayclusters/status", "rayjobs", "rayjobs/status"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ray-workload-rolebinding
  namespace: ray-workloads
subjects:
  - kind: ServiceAccount
    name: ray-pipeline-sa
    namespace: ray-workloads
roleRef:
  kind: Role
  name: ray-workload-role
  apiGroup: rbac.authorization.k8s.io
