apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: ray-cluster-monitor
  namespace: ray-workloads
  labels:
    release: prometheus-stack
    app.kubernetes.io/part-of: ray-platform
spec:
  selector:
    matchLabels:
      ray.io/node-type: head
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: ray-workers-monitor
  namespace: ray-workloads
  labels:
    release: prometheus-stack
    app.kubernetes.io/part-of: ray-platform
spec:
  selector:
    matchLabels:
      ray.io/node-type: worker
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
