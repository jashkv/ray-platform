apiVersion: apps/v1
kind: Deployment
metadata:
  name: kuberay-operator
  namespace: ray-system
  labels:
    app.kubernetes.io/name: kuberay-operator
    app.kubernetes.io/version: v1.2.2
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: kuberay-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kuberay-operator
    spec:
      serviceAccountName: kuberay-operator
      nodeSelector:
        workload-role: ray-head-system
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: kuberay-operator
          image: quay.io/kuberay/operator:v1.2.2
          imagePullPolicy: IfNotPresent
          args:
            - --enable-leader-election
            - --watch-namespace=ray-workloads
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 256Mi
          ports:
            - containerPort: 8080
              name: metrics
            - containerPort: 8082
              name: healthz
          livenessProbe:
            httpGet:
              path: /healthz
              port: healthz
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: healthz
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kuberay-operator
  namespace: ray-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kuberay-operator-clusterrole
rules:
  - apiGroups: ["ray.io"]
    resources: ["rayclusters", "rayclusters/status", "rayclusters/finalizers", "rayjobs", "rayjobs/status", "rayjobs/finalizers"]
    verbs: ["*"]
  - apiGroups: [""]
    resources: ["pods", "pods/status", "services", "services/status", "endpoints"]
    verbs: ["*"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kuberay-operator-binding
subjects:
  - kind: ServiceAccount
    name: kuberay-operator
    namespace: ray-system
roleRef:
  kind: ClusterRole
  name: kuberay-operator-clusterrole
  apiGroup: rbac.authorization.k8s.io
