[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ray-data-pipeline"
version = "1.0.0"
description = "Distributed AI Foundation: Ray on Kubernetes with Apache Iceberg"
readme = "README.md"
requires-python = ">=3.11, <3.13"
authors = [
    { name = "Platform Engineering Team", email = "platform-eng@company.internal" }
]
dependencies = [
    "ray[default,data,train]==2.40.0",
    "pyiceberg[glue,s3fs,sql-sqlite]==0.7.1",
    "cryptography<49",
    "xgboost>=2.1.0",
    "scikit-learn>=1.5.0",
    "pandas>=2.2.0",
    "pyarrow>=17.0.0",
    "pydantic>=2.9.0",
    "boto3>=1.35.0",
    "fsspec>=2023.1.0,<2024.1.0",
    "s3fs>=2023.1.0,<2024.1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["application*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C4",  # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["application/tests", "tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
